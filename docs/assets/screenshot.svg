  <text x="890" y="68" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Finalize AlfaFocus Design Wireframes</text>
  <text x="890" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#71717A">Work Project</text>
  
  <!-- Timer Card -->
  <rect x="874" y="114" width="302" height="340" rx="16" fill="#18181B" stroke="#27272A"/>
  
  <!-- Pills -->
  <rect x="940" y="130" width="170" height="32" rx="8" fill="#27272A"/>
  <rect x="942" y="132" width="56" height="28" rx="6" fill="#059669"/>
  <text x="956" y="151" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">Pomo</text>
  <text x="1010" y="151" font-family="system-ui, sans-serif" font-size="11" fill="#A1A1AA">Deep</text>
  <text x="1055" y="151" font-family="system-ui, sans-serif" font-size="11" fill="#A1A1AA">Stopwatch</text>
  
  <!-- Timer Ring -->
  <circle cx="1025" cy="250" r="75" fill="none" stroke="#27272A" stroke-width="6"/>
  <circle cx="1025" cy="250" r="75" fill="none" stroke="#10B981" stroke-width="6" stroke-dasharray="471" stroke-dashoffset="120" stroke-linecap="round"/>
  <text x="980" y="258" font-family="monospace" font-size="34" font-weight="bold" fill="#FAFAFA">18:42</text>
  <text x="998" y="278" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#71717A" letter-spacing="1">FOCUSING</text>
  
  <!-- Buttons -->
  <rect x="898" y="380" width="195" height="44" rx="10" fill="#059669"/>
  <text x="975" y="407" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">⏸ Pause</text>
  <rect x="1105" y="380" width="46" height="44" rx="10" fill="#27272A" stroke="#3F3F46"/>
  <text x="1120" y="407" font-family="system-ui, sans-serif" font-size="14" fill="#A1A1AA">↺</text>
  
  <!-- Daily Progress -->
  <rect x="874" y="470" width="302" height="65" rx="12" fill="#18181B" stroke="#27272A"/>
  <text x="890" y="495" font-family="system-ui, sans-serif" font-size="12" fill="#A1A1AA">Daily Progress</text>
  <text x="1115" y="495" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#10B981">1 / 3 Tasks</text>
  <rect x="890" y="508" width="270" height="6" rx="3" fill="#27272A"/>
  <rect x="890" y="508" width="90" height="6" rx="3" fill="#10B981"/>

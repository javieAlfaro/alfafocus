  <text x="34" y="46" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">A</text>
  <text x="68" y="46" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#FAFAFA">AlfaFocus</text>
  
  <!-- Nav items -->
  <rect x="16" y="80" width="208" height="38" rx="8" fill="#27272A" fill-opacity="0.8"/>

  <!-- Center Area -->
  <!-- Header -->
  <text x="270" y="52" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#FAFAFA">Today's Focus</text>
  <text x="270" y="76" font-family="system-ui, sans-serif" font-size="13" fill="#71717A">September 21, 2026</text>
  
  <!-- Quick add bar -->
  <rect x="270" y="96" width="550" height="46" rx="12" fill="#18181B" stroke="#27272A"/>

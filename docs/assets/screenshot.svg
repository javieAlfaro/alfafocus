  <text x="36" y="144" font-family="system-ui, sans-serif" font-size="14" fill="#A1A1AA">≡ Lists &amp; Projects</text>
  <text x="36" y="184" font-family="system-ui, sans-serif" font-size="14" fill="#A1A1AA">📅 Calendar</text>
  <text x="36" y="224" font-family="system-ui, sans-serif" font-size="14" fill="#A1A1AA">📊 Habits &amp; Stats</text>
  

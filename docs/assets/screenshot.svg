  <text x="320" y="192" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#FAFAFA">Finalize AlfaFocus Design Wireframes</text>
  <rect x="320" y="204" width="120" height="6" rx="3" fill="#27272A"/>
  <rect x="320" y="204" width="90" height="6" rx="3" fill="#10B981"/>
  <rect x="740" y="180" width="60" height="22" rx="4" fill="#27272A"/>
  <text x="752" y="195" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#A1A1AA">WORK</text>
  
  <rect x="270" y="242" width="550" height="65" rx="12" fill="#18181B" stroke="#27272A"/>
  <circle cx="296" cy="274" r="10" fill="none" stroke="#71717A" stroke-width="2"/>
  <text x="320" y="271" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#E4E4E7">Review Q1 Marketing Strategy</text>
  <rect x="740" y="260" width="60" height="22" rx="4" fill="#27272A"/>
  <text x="752" y="275" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#A1A1AA">WORK</text>
  
  <rect x="270" y="319" width="550" height="65" rx="12" fill="#18181B" stroke="#27272A"/>
  <circle cx="296" cy="351" r="10" fill="#059669"/>
  <text x="291" y="356" font-family="system-ui, sans-serif" font-size="12" fill="#FFFFFF">✓</text>
  <text x="320" y="355" font-family="system-ui, sans-serif" font-size="14" text-decoration="line-through" fill="#71717A">Morning Workout</text>
  <rect x="715" y="340" width="85" height="22" rx="4" fill="#27272A"/>
  <text x="725" y="355" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#A1A1AA">PERSONAL</text>
  
  <!-- Right Panel -->
  <rect x="850" y="0" width="350" height="800" fill="#09090B" stroke="#27272A" stroke-width="1"/>
  
  <!-- Focusing Banner -->
  <rect x="874" y="24" width="302" height="74" rx="12" fill="#18181B" stroke="#27272A"/>

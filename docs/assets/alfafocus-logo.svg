    fill="none"
  />

  <!-- Wordmark Text -->
  <text x="48" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FAFAFA" letter-spacing="-0.5">Alfa</text>
  <text x="89" y="27" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#10B981" letter-spacing="-0.5">Focus</text>

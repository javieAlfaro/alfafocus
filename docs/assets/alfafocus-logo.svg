  <!-- Continuous Greek Alpha (α) with bold lines -->
  <path 
    d="M 26.5 11.5 C 24 16 21.5 20 18.5 20 C 14.8 20 11.8 17.1 11.8 13.5 C 11.8 9.9 14.8 7 18.5 7 C 22.2 7 25.2 9.9 25.2 13.5 C 25.2 17.1 22.2 20 18.5 20 C 14.8 20 11.8 22.9 11.8 26.5 C 11.8 30.1 14.8 33 18.5 33 C 21.5 33 24 30 26.5 28.5" 

          <circle cx="45" cy="15" r="13" fill="#3B82F6"/><text x="41" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">T</text>
          <circle cx="75" cy="15" r="13" fill="#3B82F6"/><text x="71" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">W</text>
          <circle cx="105" cy="15" r="13" fill="#3B82F6"/><text x="101" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">T</text>
          <circle cx="135" cy="15" r="13" fill="#3B82F6"/><text x="131" y="19" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">F</text>
          <circle cx="165" cy="15" r="13" fill="#27272A"/><text x="161" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#71717A">S</text>
          <circle cx="195" cy="15" r="13" fill="#27272A"/><text x="191" y="19" font-family="system-ui, sans-serif" font-size="11" fill="#71717A">S</text>

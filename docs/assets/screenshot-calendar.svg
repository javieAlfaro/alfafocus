<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#09090B"/>
  
  <!-- Left Global Sidebar -->
  <rect x="0" y="0" width="240" height="800" fill="#09090B" stroke="#27272A" stroke-width="1"/>
  <rect x="24" y="24" width="32" height="32" rx="8" fill="#059669"/>
  <text x="34" y="46" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#FFFFFF">A</text>
  <text x="68" y="46" font-family="system-ui, sans-serif" font-weight="bold" font-size="18" fill="#FAFAFA">AlfaFocus</text>
  
  <!-- Nav items -->
  <text x="36" y="104" font-family="system-ui, sans-serif" font-size="14" fill="#A1A1AA">? Today</text>
  <text x="36" y="144" font-family="system-ui, sans-serif" font-size="14" fill="#A1A1AA">= Lists &amp; Projects</text>
  <rect x="16" y="160" width="208" height="38" rx="8" fill="#27272A" fill-opacity="0.8"/>
  <text x="36" y="184" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#10B981">?? Calendar</text>
  <text x="36" y="224" font-family="system-ui, sans-serif" font-size="14" fill="#A1A1AA">?? Habits &amp; Stats</text>
  
  <!-- Bottom Streak -->
  <rect x="16" y="690" width="208" height="42" rx="8" fill="#18181B" stroke="#27272A"/>
  <text x="30" y="716" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#10B981">?? 7 Days Streak</text>
  
  <!-- Center: Calendar Grid -->
  <g transform="translate(270, 30)">
    <!-- Header -->
    <text x="0" y="30" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#FAFAFA">October 2026</text>
    <text x="0" y="55" font-family="system-ui, sans-serif" font-size="13" fill="#71717A">Scheduled Focus Sessions &amp; Milestones</text>
    
    <!-- Weekday Headers -->
    <g transform="translate(0, 80)">
      <text x="35" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#71717A">SUN</text>
      <text x="115" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#71717A">MON</text>
      <text x="195" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#71717A">TUE</text>
      <text x="275" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#71717A">WED</text>
      <text x="355" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#71717A">THU</text>
      <text x="435" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#71717A">FRI</text>
      <text x="515" y="0" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#71717A">SAT</text>
    </g>
    
    <!-- Month Days Grid (Selected Day: Oct 2) -->
    <g transform="translate(0, 100)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="8" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#52525B">27</text>
      
      <rect x="80" y="0" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="88" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#52525B">28</text>
      
      <rect x="160" y="0" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="168" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#52525B">29</text>
      
      <rect x="240" y="0" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="248" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#52525B">30</text>
      
      <rect x="320" y="0" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="328" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">1</text>
      <rect x="325" y="32" width="66" height="18" rx="4" fill="#064E3B"/>
      <text x="329" y="44" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#34D399">Pomo 25m</text>
      
      <!-- Day 2 (Active Today Highlight) -->
      <rect x="400" y="0" width="76" height="76" rx="8" fill="#18181B" stroke="#10B981" stroke-width="2"/>
      <circle cx="415" cy="18" r="9" fill="#10B981"/>
      <text x="412" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#09090B">2</text>
      <rect x="405" y="32" width="66" height="18" rx="4" fill="#059669"/>
      <text x="409" y="44" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#FFFFFF">Deep 50m</text>
      <rect x="405" y="52" width="66" height="18" rx="4" fill="#1E3A8A"/>
      <text x="409" y="64" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" fill="#93C5FD">Schema</text>
      
      <rect x="480" y="0" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="488" y="20" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">3</text>
      
      <!-- Row 2 -->
      <rect x="0" y="82" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="8" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">4</text>
      <rect x="80" y="82" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="88" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">5</text>
      <rect x="160" y="82" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="168" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">6</text>
      <rect x="240" y="82" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="248" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">7</text>
      <rect x="320" y="82" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="328" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">8</text>
      <rect x="400" y="82" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="408" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">9</text>
      <rect x="480" y="82" width="76" height="76" rx="8" fill="#18181B" stroke="#27272A"/>
      <text x="488" y="102" font-family="system-ui, sans-serif" font-size="12" fill="#FAFAFA">10</text>
      
      <!-- Row 3 & 4 Grid placeholders -->
      <rect x="0" y="164" width="556" height="158" rx="8" fill="#18181B" fill-opacity="0.3" stroke="#27272A" stroke-dasharray="4 4"/>
      <text x="220" y="248" font-family="system-ui, sans-serif" font-size="13" fill="#52525B">October 11 – 31 Scheduled Events</text>
    </g>
  </g>
  
  <!-- Right Panel: Date Inspector (Oct 2 Selected) -->
  <g transform="translate(850, 0)">
    <rect x="0" y="0" width="350" height="800" fill="#09090B" stroke="#27272A" stroke-width="1"/>
    
    <text x="24" y="52" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#FAFAFA">Friday, Oct 2</text>
    <text x="24" y="74" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10B981">TODAY'S SCHEDULE</text>
    
    <!-- Agenda Card 1 -->
    <rect x="24" y="96" width="302" height="80" rx="10" fill="#18181B" stroke="#27272A"/>
    <text x="40" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#10B981">09:00 AM – 09:50 AM</text>
    <text x="40" y="142" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Deep Work: PostgreSQL Schema</text>
    <text x="40" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#71717A">Completed (50m Focus Session)</text>
    
    <!-- Agenda Card 2 -->
    <rect x="24" y="190" width="302" height="80" rx="10" fill="#18181B" stroke="#27272A"/>
    <text x="40" y="216" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#3B82F6">02:00 PM – 02:25 PM</text>
    <text x="40" y="236" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#FAFAFA">Pomodoro: Design Review</text>
    <text x="40" y="254" font-family="system-ui, sans-serif" font-size="11" fill="#71717A">Completed (25m Focus Session)</text>
    
    <!-- Quick Add to Date Button -->
    <rect x="24" y="286" width="302" height="42" rx="8" fill="#10B981"/>
    <text x="110" y="312" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#09090B">+ Add Event / Block</text>
  </g>
